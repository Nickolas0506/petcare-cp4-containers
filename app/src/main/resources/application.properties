# =============================================================================
# PetCare API - configuracao da aplicacao
# Nenhuma senha fica aqui: tudo vem de variavel de ambiente.
# =============================================================================
spring.application.name=petcare

# ---- Banco de dados (MySQL em container) ------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petcare}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:petcare_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O container do banco pode demorar alguns segundos a mais para aceitar conexao.
# Com initialization-fail-timeout = -1 a aplicacao sobe mesmo assim e vai
# reconectando, em vez de morrer no boot.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ---- JPA --------------------------------------------------------------------
# O schema vem do DDL embutido na imagem do banco, entao o Hibernate NAO cria
# nem altera tabela nenhuma - so valida o mapeamento.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Actuator ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ---- Servidor ---------------------------------------------------------------
server.port=8080
server.error.include-message=always
