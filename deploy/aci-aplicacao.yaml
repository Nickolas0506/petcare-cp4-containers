# =============================================================================
# PetCare - definicao do Container Instance da APLICACAO (documentacao)
#
# Registra a configuracao aplicada pelo script 06-subir-aplicacao.ps1.
# O DB_HOST e o nome DNS publico do container do banco.
#
# Para aplicar por aqui em vez do script:
#   az container create --resource-group rm564099-cp4-rg --file deploy/aci-aplicacao.yaml
# =============================================================================
apiVersion: 2021-10-01
location: brazilsouth
name: rm564099-app
type: Microsoft.ContainerInstance/containerGroups

properties:
  osType: Linux
  restartPolicy: OnFailure

  imageRegistryCredentials:
    - server: rm564099acr.azurecr.io
      username: rm564099acr
      password: <SENHA_DO_ACR>

  containers:
    - name: rm564099-app
      properties:
        image: rm564099acr.azurecr.io/rm564099-app:latest
        resources:
          requests:
            cpu: 1
            memoryInGB: 2
        ports:
          - port: 8080
            protocol: TCP
        environmentVariables:
          - name: DB_HOST
            value: rm564099-db.brazilsouth.azurecontainer.io
          - name: DB_PORT
            value: "3306"
          - name: DB_NAME
            value: petcare
          - name: DB_USER
            value: petcare_user
          - name: DB_PASSWORD
            secureValue: <SENHA_DO_BANCO>

  ipAddress:
    type: Public
    dnsNameLabel: rm564099-app
    ports:
      - port: 8080
        protocol: TCP
